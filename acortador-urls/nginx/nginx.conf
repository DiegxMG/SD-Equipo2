# Puerta de entrada LOCAL: hace el papel del balanceador/Ingress de Google Cloud.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker

    set $links     http://links:8000;
    set $analytics http://analytics:8000;
    set $redirect  http://redirect:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/docs         { proxy_pass $links; }
    location = /api/openapi.json { proxy_pass $links; }
    location /api/links          { proxy_pass $links; }
    location /api/stats          { proxy_pass $analytics; }

    location = /app              { return 301 /app/; }
    location /app/               { proxy_pass $links; }

    # Todo lo demás (/, /abc1234): servicio de redirección
    location /                   { proxy_pass $redirect; }
}
